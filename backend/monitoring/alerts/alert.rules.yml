groups:
  - name: schedulord.rules
    rules:
      - alert: ApiGatewayHighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(node_http_request_duration_seconds_bucket[5m]))) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API Gateway high latency (p95 > 1s)"

      - alert: GoEngineProcessSlowP95
        expr: histogram_quantile(0.95, sum by (le) (rate(go_engine_process_duration_seconds_bucket[5m]))) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Go Engine /process slow (p95 > 0.5s)"

      - alert: HighAllocationRejectionRate
        expr: rate(schedulord_allocations_total{status="rejected"}[5m]) / rate(schedulord_allocations_total[5m]) > 0.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 50% of allocations are being rejected"

      - alert: KafkaEventFailures
        expr: rate(schedulord_kafka_events_published_total{status="fallback"}[5m]) > 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Kafka event publishing failures detected"
