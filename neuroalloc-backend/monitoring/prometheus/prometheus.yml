global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts/alert.rules.yml

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: "go-engine"
    metrics_path: /metrics
    static_configs:
      - targets: ["go-engine:9090"]

