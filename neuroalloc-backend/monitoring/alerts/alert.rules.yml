groups:
  - name: neuroalloc.rules
    rules:
      - alert: ApiGatewayHighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(node_http_request_duration_seconds_bucket[5m]))) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API Gateway high latency (p95 > 1s)"

      - alert: GoEngineProcessSlowP95
        expr: histogram_quantile(0.95, rate(go_engine_process_duration_seconds_bucket[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Go Engine /process slow (p95 > 0.5s)"

