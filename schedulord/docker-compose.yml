name: schedulord

services:
  redis:
    image: redis:7-alpine
    container_name: schedulord-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: schedulord-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: schedulord-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  go-engine:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
    container_name: schedulord-go-engine
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      GO_ENGINE_PORT: "9090"
      GO_ENGINE_WORKERS: "4"

  api-gateway:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    container_name: schedulord-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      MONGODB_URI: "mongodb+srv://Mukilan:Mukilan0608@cluster0.yi7p6ff.mongodb.net/schedulord?retryWrites=true&w=majority&appName=Cluster0"
      JWT_SECRET: "change-me-in-production"
      GO_ENGINE_BASE_URL: "http://go-engine:9090"
      CORS_ORIGIN: "*"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_CLIENT_ID: "schedulord-api-gateway"
      REDIS_URL: "redis://redis:6379"
      BOOTSTRAP_ADMIN_EMAIL: "admin@schedulord.local"
      BOOTSTRAP_ADMIN_PASSWORD: "ChangeMe123!"
      REQUEST_PROCESSOR_POLL_MS: "500"
      REQUEST_PROCESSOR_BATCH_SIZE: "10"
      REQUEST_PROCESSOR_LEASE_MS: "30000"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      go-engine:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: schedulord-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - api-gateway

  prometheus:
    build:
      context: .
      dockerfile: docker/prometheus.Dockerfile
    container_name: schedulord-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts/alert.rules.yml:/etc/prometheus/alerts/alert.rules.yml:ro
    depends_on:
      - api-gateway
      - go-engine

  grafana:
    build:
      context: .
      dockerfile: docker/grafana.Dockerfile
    container_name: schedulord-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  redis_data:
  zookeeper_data:
  prometheus_data:
  grafana_data:
